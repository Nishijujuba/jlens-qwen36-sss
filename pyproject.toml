[project]
name = "jlens-qwen35-wsl"
version = "0.3.0"
description = "Layer readout and residual intervention debugger for Qwen3.5-0.8B-Base on Windows 11 + WSL"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.7",
    "transformers>=5.13,<6",
    "accelerate>=1.6",
    "numpy>=2.0",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
    "debugpy>=1.8",
]

[project.scripts]
jlens-wsl = "jlens_wsl.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jlens_wsl*"]

[tool.setuptools.package-data]
jlens_wsl = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests_wsl"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
